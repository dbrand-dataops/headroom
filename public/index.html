<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Headroom: a personal psychological load management tool built on the stress-bucket model. Know your headroom.">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Headroom | know your headroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --teal: #4fd1c5;
      --teal-deep: #2c7a7b;
      --teal-dim: rgba(79, 209, 197, 0.15);
      --amber: #f6ad55;
      --amber-deep: #c77c2a;
      --amber-dim: rgba(246, 173, 85, 0.15);
      --coral: #fc8181;
      --coral-deep: #c53030;
      --coral-dim: rgba(252, 129, 129, 0.15);
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-elevated: #273548;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --text-bright: #f8fafc;
      --border: rgba(79, 209, 197, 0.08);
      --border-hover: rgba(79, 209, 197, 0.25);
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    #root { min-height: 100vh; }

    /* ─── NAV ─── */
    nav {
      position: fixed; top: 0; width: 100%; z-index: 100;
      padding: 1.25rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-family: var(--font-display); font-size: 1.35rem; font-weight: 600;
      color: var(--teal); letter-spacing: -0.02em; cursor: pointer;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      color: var(--text-muted); text-decoration: none; font-size: 0.9rem;
      font-weight: 500; transition: color 0.2s; cursor: pointer;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--teal); }

    /* ─── SHARED ─── */
    .page { padding-top: 80px; min-height: 100vh; }
    .page-section { padding: 5rem 2rem; }
    .page-section + .page-section { border-top: 1px solid var(--border); }
    .section-inner { max-width: 900px; margin: 0 auto; }
    .section-label {
      font-size: 0.8rem; font-weight: 500; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--teal); margin-bottom: 1rem;
    }
    .section-inner h2 {
      font-family: var(--font-display); font-size: clamp(1.8rem, 3.5vw, 2.4rem);
      font-weight: 600; color: var(--text-bright); line-height: 1.25;
      letter-spacing: -0.02em; margin-bottom: 1.5rem;
    }
    .section-inner p { color: var(--text-muted); font-size: 1.05rem; max-width: 640px; margin-bottom: 1.25rem; }

    .btn-primary {
      display: inline-block; padding: 0.9rem 2.2rem;
      background: var(--teal-deep); color: var(--text-bright);
      text-decoration: none; font-family: var(--font-body);
      font-weight: 500; font-size: 1rem; border-radius: 6px;
      border: 1px solid var(--teal); transition: all 0.25s; cursor: pointer;
    }
    .btn-primary:hover { background: var(--teal); color: var(--bg); }

    /* ─── HERO ─── */
    .hero {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 6rem 2rem 4rem; position: relative;
    }
    .hero::before {
      content: ''; position: absolute; top: -20%; right: -10%;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(79,209,197,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-inner {
      max-width: 1100px; width: 100%;
      display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center;
    }
    .hero-text h1 {
      font-family: var(--font-display); font-size: clamp(2.5rem, 5vw, 3.8rem);
      font-weight: 600; color: var(--text-bright); line-height: 1.15;
      letter-spacing: -0.03em; margin-bottom: 0.5rem;
    }
    .hero-text .strapline {
      font-family: var(--font-display); font-style: italic; font-weight: 300;
      font-size: 1.35rem; color: var(--teal); margin-bottom: 2rem;
      opacity: 0; animation: fadeUp 0.8s ease 0.3s forwards;
    }
    .hero-text p {
      font-size: 1.1rem; color: var(--text-muted); max-width: 480px;
      margin-bottom: 2.5rem; opacity: 0; animation: fadeUp 0.8s ease 0.5s forwards;
    }
    .hero .btn-primary { opacity: 0; animation: fadeUp 0.8s ease 0.7s forwards; }
    .hero-bucket {
      display: flex; justify-content: center; align-items: center;
      opacity: 0; animation: fadeIn 1.2s ease 0.4s forwards;
    }

    /* ─── CONCEPT CARDS ─── */
    .concept-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 3rem; }
    .concept-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 2rem 1.5rem; transition: border-color 0.3s, transform 0.3s;
    }
    .concept-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
    .card-icon {
      width: 44px; height: 44px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.25rem; font-size: 1.3rem;
    }
    .card-icon.teal { background: var(--teal-dim); }
    .card-icon.amber { background: var(--amber-dim); }
    .card-icon.coral { background: var(--coral-dim); }
    .concept-card h3 {
      font-family: var(--font-display); font-weight: 600; font-size: 1.15rem;
      color: var(--text-bright); margin-bottom: 0.6rem;
    }
    .concept-card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; }

    /* ─── ORIGIN ─── */
    .origin-quote {
      font-family: var(--font-display); font-style: italic; font-weight: 300;
      font-size: 1.3rem; color: var(--text); border-left: 3px solid var(--teal);
      padding-left: 1.5rem; margin: 2rem 0; max-width: 580px;
    }

    /* ─── CTA ─── */
    .cta-section { text-align: center; }
    .cta-section .section-inner { display: flex; flex-direction: column; align-items: center; }
    .cta-section p { text-align: center; }

    /* ─── FOOTER ─── */
    footer {
      padding: 2.5rem 2rem; text-align: center; color: var(--text-muted);
      font-size: 0.85rem; border-top: 1px solid var(--border);
    }
    footer a { color: var(--teal); text-decoration: none; cursor: pointer; }

    /* ═══════════════════════════════════════════════
       DEMO PAGE
       ═══════════════════════════════════════════════ */

    .demo-page { padding-top: 80px; min-height: 100vh; }

    .demo-layout {
      max-width: 1100px; margin: 0 auto; padding: 2rem;
      display: grid; grid-template-columns: 300px 1fr;
      gap: 2.5rem; align-items: start;
    }

    .bucket-panel {
      position: sticky; top: 100px;
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
    }

    .bucket-svg-wrap { transition: filter 0.5s; }

    .level-reading {
      font-family: var(--font-display); font-size: 2.8rem; font-weight: 600;
      letter-spacing: -0.03em; transition: color 0.5s;
    }
    .level-label {
      font-size: 0.85rem; color: var(--text-muted); margin-top: -0.5rem;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .headroom-reading {
      font-family: var(--font-display); font-style: italic; font-weight: 300;
      font-size: 1.1rem; color: var(--text-muted);
    }
    .reset-btn {
      background: none; border: 1px solid rgba(148,163,184,0.2);
      color: var(--text-muted); font-family: var(--font-body);
      font-size: 0.8rem; padding: 0.4rem 1rem; border-radius: 4px;
      cursor: pointer; transition: all 0.2s; margin-top: 0.25rem;
    }
    .reset-btn:hover { border-color: var(--coral); color: var(--coral); }

    .items-panel { display: flex; flex-direction: column; gap: 2rem; }

    .item-group h3 {
      font-family: var(--font-display); font-weight: 600; font-size: 1.05rem;
      margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .item-group h3 .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .item-group.fillers h3 { color: var(--coral); }
    .item-group.fillers .dot { background: var(--coral); }
    .item-group.emptiers h3 { color: var(--teal); }
    .item-group.emptiers .dot { background: var(--teal); }

    .items-grid { display: flex; flex-wrap: wrap; gap: 0.6rem; }

    .item-btn {
      padding: 0.6rem 1.1rem; border-radius: 6px;
      font-family: var(--font-body); font-size: 0.9rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s; border: 1px solid;
      user-select: none;
    }
    .item-btn.filler {
      background: var(--coral-dim); border-color: rgba(252,129,129,0.2); color: var(--coral);
    }
    .item-btn.filler:hover {
      background: rgba(252,129,129,0.25); border-color: var(--coral); transform: translateY(-1px);
    }
    .item-btn.emptier {
      background: var(--teal-dim); border-color: rgba(79,209,197,0.2); color: var(--teal);
    }
    .item-btn.emptier:hover {
      background: rgba(79,209,197,0.25); border-color: var(--teal); transform: translateY(-1px);
    }
    .item-btn:active { transform: scale(0.96); }
    .item-btn .impact { font-size: 0.75rem; opacity: 0.6; margin-left: 0.3rem; }
    .item-btn.tapped { animation: tapPulse 0.3s ease; }
    @keyframes tapPulse {
      0% { transform: scale(1); }  50% { transform: scale(0.93); }  100% { transform: scale(1); }
    }

    .history-section { margin-top: 0.5rem; }
    .history-section h3 {
      font-family: var(--font-display); font-weight: 600; font-size: 1.05rem;
      color: var(--text-bright); margin-bottom: 1rem;
    }
    .history-chart-wrap {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem;
    }
    .history-log-wrap {
      position: relative;
      max-height: 320px;
      overflow: hidden;
    }
    .history-log-wrap::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
      background: linear-gradient(transparent, var(--bg));
      pointer-events: none; z-index: 1;
    }
    .history-log {
      display: flex; flex-direction: column; gap: 0.35rem;
      max-height: 320px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: var(--bg-elevated) var(--bg-card);
      padding-bottom: 2.5rem;
    }
    .log-entry {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.5rem 0.75rem; border-radius: 6px;
      font-size: 0.88rem; background: var(--bg-card); border: 1px solid var(--border);
    }
    .log-entry .time {
      color: var(--text-muted); font-size: 0.8rem; min-width: 44px;
      font-variant-numeric: tabular-nums;
    }
    .log-entry .label { flex: 1; color: var(--text); }
    .log-entry .delta {
      font-weight: 600; font-size: 0.85rem; font-variant-numeric: tabular-nums;
      min-width: 40px; text-align: right;
    }
    .log-entry .delta.up { color: var(--coral); }
    .log-entry .delta.down { color: var(--teal); }
    .log-entry .level-after {
      color: var(--text-muted); font-size: 0.8rem; min-width: 32px; text-align: right;
    }

    .demo-banner {
      background: var(--bg-card); border-bottom: 1px solid var(--border);
      padding: 0.75rem 2rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);
    }
    .demo-banner strong { color: var(--amber); font-weight: 500; }

    /* ─── PLACEHOLDER ─── */
    .placeholder-page {
      padding-top: 80px; min-height: 80vh;
      display: flex; align-items: center; justify-content: center;
    }
    .placeholder-inner { text-align: center; max-width: 500px; }
    .placeholder-inner h1 {
      font-family: var(--font-display); font-size: 2rem; font-weight: 600;
      color: var(--text-bright); margin-bottom: 1rem;
    }
    .placeholder-inner p { color: var(--text-muted); font-size: 1.05rem; }

    /* ─── CONTENT PAGES ─── */
    .content-page { padding-top: 80px; min-height: 100vh; }

    .content-hero {
      padding: 4rem 2rem 3rem;
      border-bottom: 1px solid var(--border);
    }
    .content-hero .section-inner { max-width: 720px; }
    .content-hero h1 {
      font-family: var(--font-display); font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 600; color: var(--text-bright); line-height: 1.2;
      letter-spacing: -0.02em; margin-bottom: 1rem;
    }
    .content-hero .lead {
      font-size: 1.15rem; color: var(--text-muted); max-width: 600px; line-height: 1.7;
    }

    .content-section {
      padding: 3.5rem 2rem;
    }
    .content-section + .content-section { border-top: 1px solid var(--border); }
    .content-section .section-inner { max-width: 720px; }
    .content-section h2 {
      font-family: var(--font-display); font-size: 1.5rem; font-weight: 600;
      color: var(--text-bright); margin-bottom: 1.25rem; letter-spacing: -0.01em;
    }
    .content-section p {
      color: var(--text-muted); font-size: 1rem; line-height: 1.8;
      margin-bottom: 1.25rem; max-width: 640px;
    }
    .content-section p strong { color: var(--text); font-weight: 500; }

    .content-quote {
      font-family: var(--font-display); font-style: italic; font-weight: 300;
      font-size: 1.2rem; color: var(--text); border-left: 3px solid var(--teal);
      padding-left: 1.5rem; margin: 2rem 0; max-width: 560px; line-height: 1.6;
    }

    /* Why page - network cards */
    .network-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;
      margin: 2rem 0;
    }
    .network-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.5rem;
    }
    .network-card h4 {
      font-family: var(--font-display); font-weight: 600; font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    .network-card p { font-size: 0.92rem; margin-bottom: 0; }
    .network-card.reflective h4 { color: var(--teal); }
    .network-card.automatic h4 { color: var(--coral); }

    .ref-list { margin: 2rem 0; }
    .ref-item {
      padding: 0.75rem 0; border-bottom: 1px solid var(--border);
      font-size: 0.92rem; color: var(--text-muted); line-height: 1.6;
    }
    .ref-item strong { color: var(--text); font-weight: 500; }
    .ref-item a {
      color: var(--teal); text-decoration: none; font-size: 0.82rem;
      word-break: break-all; display: inline-block; margin-top: 0.25rem;
      opacity: 0.7; transition: opacity 0.2s;
    }
    .ref-item a:hover { opacity: 1; text-decoration: underline; }
    .ref-item .ref-supports {
      display: block; margin-top: 0.35rem; font-size: 0.88rem;
      color: var(--text-muted); line-height: 1.6;
    }

    /* Resources / download cards */
    .download-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;
      margin-top: 2rem;
    }
    .download-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.75rem;
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    .download-card h3 {
      font-family: var(--font-display); font-weight: 600; font-size: 1.05rem;
      color: var(--text-bright);
    }
    .download-card p { font-size: 0.92rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .download-link {
      display: inline-flex; align-items: center; gap: 0.5rem;
      color: var(--teal); text-decoration: none; font-weight: 500;
      font-size: 0.9rem; transition: opacity 0.2s;
    }
    .download-link:hover { opacity: 0.8; }

    /* Content quote with attribution */
    .content-model-statement {
      background: var(--bg-card); border: 1px solid var(--border);
      border-left: 3px solid var(--teal); border-radius: 0 10px 10px 0;
      padding: 1.5rem 1.75rem; margin: 2rem 0;
      font-family: var(--font-display); font-style: italic; font-weight: 300;
      font-size: 1.05rem; color: var(--text); line-height: 1.7;
    }
    .content-model-statement .attribution {
      display: block; margin-top: 1rem; font-size: 0.82rem;
      font-style: normal; color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .network-grid { grid-template-columns: 1fr; }
      .contact-grid { grid-template-columns: 1fr; }
      .download-grid { grid-template-columns: 1fr; }
      .content-hero { padding: 3rem 1.5rem 2rem; }
      .content-section { padding: 3rem 1.5rem; }
    }
    .contact-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;
      margin-top: 2rem;
    }
    .contact-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 2rem;
    }
    .contact-card h3 {
      font-family: var(--font-display); font-weight: 600; font-size: 1.1rem;
      color: var(--text-bright); margin-bottom: 0.75rem;
    }
    .contact-card p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 1rem; }
    .contact-card a {
      color: var(--teal); text-decoration: none; font-weight: 500;
      border-bottom: 1px solid rgba(79,209,197,0.3); padding-bottom: 1px;
      transition: border-color 0.2s;
    }
    .contact-card a:hover { border-color: var(--teal); }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 900px) {
      .demo-layout { grid-template-columns: 1fr; gap: 2rem; }
      .bucket-panel {
        position: relative; top: 0;
        flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 1rem;
      }
      .bucket-panel svg { width: 160px; height: auto; }
      .bucket-meta {
        display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
      }
      .level-reading { font-size: 2.2rem; }
    }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.25rem; }
      .nav-links { gap: 1.25rem; }
      .nav-links a { font-size: 0.85rem; }
      .hero { padding: 5rem 1.5rem 3rem; }
      .hero-inner { grid-template-columns: 1fr; gap: 3rem; text-align: center; }
      .hero-text p { max-width: 100%; }
      .hero-bucket { order: -1; }
      .hero-bucket svg { width: 180px; }
      .concept-grid { grid-template-columns: 1fr; gap: 1rem; }
      .page-section { padding: 4rem 1.5rem; }
      .demo-layout { padding: 1.5rem; }
    }

    @media (max-width: 480px) {
      .nav-links { gap: 0.8rem; }
      .hero-bucket svg { width: 150px; }
      .bucket-panel svg { width: 140px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    // ═══════════════════════════════════════════
    // BUCKET MODEL
    // ═══════════════════════════════════════════

    function bucketFillY(level) {
      const L = Math.max(0, Math.min(100, level)) / 100;
      if (L <= 0) return 188;
      const fillH = (-98 + Math.sqrt(9604 + 11712 * L)) / 0.32;
      return 188 - Math.min(fillH, 140);
    }

    function levelColor(level) {
      if (level <= 40) return { main: '#4fd1c5', glow: 'rgba(79,209,197,0.15)' };
      if (level <= 70) return { main: '#f6ad55', glow: 'rgba(246,173,85,0.15)' };
      return { main: '#fc8181', glow: 'rgba(252,129,129,0.15)' };
    }

    function levelWord(level) {
      if (level <= 20) return 'calm';
      if (level <= 40) return 'settled';
      if (level <= 55) return 'building';
      if (level <= 70) return 'elevated';
      if (level <= 85) return 'high';
      return 'critical';
    }

    // ═══════════════════════════════════════════
    // SEED DATA
    // ═══════════════════════════════════════════

    const SEED_FILLERS = [
      { id: 1, label: 'Work pressure', value: 12 },
      { id: 2, label: 'Financial worry', value: 18 },
      { id: 3, label: 'Poor sleep', value: 10 },
      { id: 4, label: 'Family conflict', value: 15 },
      { id: 5, label: 'Health concern', value: 11 },
      { id: 6, label: 'Isolation', value: 8 },
      { id: 7, label: 'Rumination', value: 9 },
    ];

    const SEED_EMPTIERS = [
      { id: 101, label: 'Exercise', value: 14 },
      { id: 102, label: 'Good conversation', value: 11 },
      { id: 103, label: 'Time outdoors', value: 9 },
      { id: 104, label: 'Structured task', value: 8 },
      { id: 105, label: 'Rest', value: 10 },
      { id: 106, label: 'Music / creativity', value: 7 },
      { id: 107, label: 'Helping someone', value: 6 },
    ];

    function buildSeedHistory() {
      const now = Date.now();
      const h = 3600000, d = 86400000;
      const entries = [];
      let level = 0;

      const log = (offsetMs, label, delta) => {
        level = Math.max(0, Math.min(100, level + delta));
        entries.push({
          id: entries.length + 1,
          ts: new Date(now - offsetMs).toISOString(),
          label, delta, level,
          type: delta > 0 ? 'filler' : 'emptier'
        });
      };

      // Day -2 morning load
      log(2*d + 10*h, 'Work pressure', 12);
      log(2*d + 9.8*h, 'Financial worry', 18);
      log(2*d + 9.5*h, 'Poor sleep', 10);
      log(2*d + 9*h, 'Family conflict', 15);
      // Day -2 relief
      log(2*d + 5*h, 'Exercise', -14);
      log(2*d + 3*h, 'Structured task', -8);
      log(2*d + 1*h, 'Good conversation', -11);
      log(2*d + 0.5*h, 'Rest', -10);

      // Day -1 morning load
      log(1*d + 10*h, 'Financial worry', 18);
      log(1*d + 9.5*h, 'Work pressure', 12);
      log(1*d + 9*h, 'Rumination', 9);
      log(1*d + 8.5*h, 'Health concern', 11);
      // Day -1 relief
      log(1*d + 5*h, 'Time outdoors', -9);
      log(1*d + 3*h, 'Exercise', -14);
      log(1*d + 1*h, 'Music / creativity', -7);

      // Today morning load
      log(8*h, 'Work pressure', 12);
      log(7.5*h, 'Family conflict', 15);
      log(7*h, 'Poor sleep', 10);
      // Today relief
      log(4*h, 'Exercise', -14);
      log(2*h, 'Good conversation', -11);

      return { entries, level };
    }

    function BucketSVG({ level, size = 1 }) {
      const wY = bucketFillY(level);
      const fillHeight = 188 - wY;
      const col = levelColor(level);

      // Interpolate surface line x coords within the trapezoid
      const leftX = 52 + (40 - 52) * (wY - 188) / (48 - 188);
      const rightX = 148 + (160 - 148) * (wY - 188) / (48 - 188);

      return (
        <div className="bucket-svg-wrap" style={{ filter: `drop-shadow(0 0 30px ${col.glow})` }}>
          <svg viewBox="0 0 200 220" width={220 * size} height={286 * size} xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="bClip">
                <polygon points="40,48 160,48 148,188 52,188" />
              </clipPath>
              <linearGradient id={`bFill-${Math.round(level)}`} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={col.main} stopOpacity="0.75" />
                <stop offset="100%" stopColor={col.main} stopOpacity="0.3" />
              </linearGradient>
            </defs>

            {/* Midline at 50% */}
            <line x1="52" y1="118" x2="148" y2="118"
              stroke="rgba(148,163,184,0.12)" strokeWidth="1" strokeDasharray="6 4" />

            {/* Fill */}
            <rect x="30" y={wY} width="140" height={fillHeight}
              fill={`url(#bFill-${Math.round(level)})`} clipPath="url(#bClip)"
              style={{ transition: 'y 0.6s cubic-bezier(0.4,0,0.2,1), height 0.6s cubic-bezier(0.4,0,0.2,1)' }}
            />

            {/* Surface line */}
            {level > 0 && (
              <line x1={leftX} y1={wY} x2={rightX} y2={wY}
                stroke={col.main} strokeWidth="1.5" strokeOpacity="0.5"
                style={{ transition: 'all 0.6s cubic-bezier(0.4,0,0.2,1)' }}
              />
            )}

            {/* Body */}
            <polygon points="40,48 160,48 148,188 52,188"
              fill="none" stroke={col.main} strokeWidth="2.5" strokeLinejoin="round"
              style={{ transition: 'stroke 0.5s' }} />

            {/* Rim */}
            <line x1="32" y1="48" x2="168" y2="48"
              stroke={col.main} strokeWidth="3" strokeLinecap="round"
              style={{ transition: 'stroke 0.5s' }} />
          </svg>
        </div>
      );
    }


    // ═══════════════════════════════════════════
    // HISTORY CHART
    // ═══════════════════════════════════════════

    function HistoryChart({ entries }) {
      if (entries.length < 2) return null;

      const W = 520, H = 140, PAD = { t: 10, r: 15, b: 25, l: 35 };
      const plotW = W - PAD.l - PAD.r;
      const plotH = H - PAD.t - PAD.b;

      const times = entries.map(e => new Date(e.ts).getTime());
      const tMin = Math.min(...times);
      const tMax = Math.max(...times);
      const tRange = tMax - tMin || 1;

      const points = entries.map(e => {
        const x = PAD.l + ((new Date(e.ts).getTime() - tMin) / tRange) * plotW;
        const y = PAD.t + (1 - e.level / 100) * plotH;
        return { x, y, level: e.level };
      });

      const line = points.map((p, i) =>
        `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`
      ).join(' ');

      const area = line +
        ` L${points[points.length-1].x.toFixed(1)},${PAD.t + plotH}` +
        ` L${points[0].x.toFixed(1)},${PAD.t + plotH} Z`;

      const grids = [0, 25, 50, 75, 100];

      return (
        <div className="history-chart-wrap">
          <svg viewBox={`0 0 ${W} ${H}`} width="100%" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#4fd1c5" stopOpacity="0.2" />
                <stop offset="100%" stopColor="#4fd1c5" stopOpacity="0.02" />
              </linearGradient>
            </defs>

            {grids.map(v => {
              const y = PAD.t + (1 - v / 100) * plotH;
              return (
                <g key={v}>
                  <line x1={PAD.l} y1={y} x2={W - PAD.r} y2={y}
                    stroke="rgba(148,163,184,0.08)" strokeWidth="1" />
                  <text x={PAD.l - 6} y={y + 3} textAnchor="end"
                    fontSize="9" fill="#94a3b8" fontFamily="DM Sans, sans-serif">{v}</text>
                </g>
              );
            })}

            {/* 50% threshold */}
            <line x1={PAD.l} y1={PAD.t + plotH * 0.5} x2={W - PAD.r} y2={PAD.t + plotH * 0.5}
              stroke="rgba(246,173,85,0.2)" strokeWidth="1" strokeDasharray="4 3" />

            <path d={area} fill="url(#areaGrad)" />
            <path d={line} fill="none" stroke="#4fd1c5" strokeWidth="2" strokeLinejoin="round" />

            {points.map((p, i) => (
              <circle key={i} cx={p.x} cy={p.y} r="3"
                fill={levelColor(p.level).main} stroke="#0f172a" strokeWidth="1.5" />
            ))}
          </svg>
        </div>
      );
    }

    function DemoPage() {
      const seed = useMemo(() => buildSeedHistory(), []);
      const [level, setLevel] = useState(seed.level);
      const [entries, setEntries] = useState(seed.entries);
      const [tapped, setTapped] = useState(null);
      const logRef = useRef(null);

      const handleItem = useCallback((item, type) => {
        const delta = type === 'filler' ? item.value : -item.value;
        const newLevel = Math.max(0, Math.min(100, level + delta));

        setLevel(newLevel);
        setEntries(prev => [...prev, {
          id: Date.now(), ts: new Date().toISOString(),
          label: item.label, delta, level: newLevel, type
        }]);
        setTapped(item.id);
        setTimeout(() => setTapped(null), 300);
        setTimeout(() => {
          if (logRef.current) logRef.current.scrollTop = 0;
        }, 50);
      }, [level]);

      const handleReset = () => {
        const s = buildSeedHistory();
        setLevel(s.level);
        setEntries(s.entries);
      };

      const col = levelColor(level);
      const headroom = 100 - Math.round(level);

      const formatTime = (ts) => {
        const d = new Date(ts);
        const diffDays = Math.floor((Date.now() - d) / 86400000);
        const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        if (diffDays === 0) return time;
        if (diffDays === 1) return 'yday';
        return `${diffDays}d`;
      };

      return (
        <div className="demo-page">
          <div className="demo-banner">
            <strong>Demo</strong> / Tap items to see the bucket respond. Data resets on reload.
          </div>
          <div className="demo-layout">
            <div className="bucket-panel">
              <BucketSVG level={level} size={1.1} />
              <div className="bucket-meta">
                <div className="level-reading" style={{ color: col.main }}>{Math.round(level)}%</div>
                <div className="level-label">{levelWord(level)}</div>
                <div className="headroom-reading">{headroom}% headroom</div>
              </div>
              <button className="reset-btn" onClick={handleReset}>Reset demo</button>
            </div>

            <div className="items-panel">
              <div className="item-group fillers">
                <h3><span className="dot"></span> Load</h3>
                <div className="items-grid">
                  {SEED_FILLERS.map(item => (
                    <button key={item.id}
                      className={`item-btn filler${tapped === item.id ? ' tapped' : ''}`}
                      onClick={() => handleItem(item, 'filler')}>
                      {item.label}<span className="impact">+{item.value}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="item-group emptiers">
                <h3><span className="dot"></span> Relief</h3>
                <div className="items-grid">
                  {SEED_EMPTIERS.map(item => (
                    <button key={item.id}
                      className={`item-btn emptier${tapped === item.id ? ' tapped' : ''}`}
                      onClick={() => handleItem(item, 'emptier')}>
                      {item.label}<span className="impact">-{item.value}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="history-section">
                <h3>History</h3>
                <HistoryChart entries={entries} />
                <div className="history-log-wrap">
                <div className="history-log" ref={logRef}>
                  {entries.slice().reverse().map(e => (
                    <div className="log-entry" key={e.id}>
                      <span className="time">{formatTime(e.ts)}</span>
                      <span className="label">{e.label}</span>
                      <span className={`delta ${e.delta > 0 ? 'up' : 'down'}`}>
                        {e.delta > 0 ? '+' : ''}{e.delta}
                      </span>
                      <span className="level-after">{Math.round(e.level)}%</span>
                    </div>
                  ))}
                </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function WhyPage() {
      const Ref = ({ num, authors, title, journal, url }) => (
        <div className="ref-item">
          <strong>[{num}] {authors}.</strong> {title}. <em>{journal}.</em>
          {url && <a href={url} target="_blank" rel="noopener noreferrer">{url}</a>}
        </div>
      );

      return (
        <div className="content-page">
          <div className="content-hero">
            <div className="section-inner">
              <div className="section-label">Why it works</div>
              <h1>A grounded explanation of the biology, the disease, and the mechanism</h1>
              <p className="lead">Headroom works because it operationalises an accurate model of what addiction is and what recovery requires. This page explains the biology, the disease model, and the specific mechanism the application addresses.</p>
            </div>
          </div>

          <div className="content-section">
            <div className="section-inner">
              <h2>The thing addiction actually is</h2>
              <p>Addiction is not a failure of willpower. It is not a moral defect, a character flaw, or a problem of insufficient discipline. It is a neurobiological disease of the brain's reward, motivation, and executive control systems, and it has been recognised as such by every major medical and research body for decades.</p>
              <p>The American Society of Addiction Medicine defines it as a treatable, chronic medical disease involving complex interactions among brain circuits, genetics, the environment, and an individual's life experiences. The National Institute on Drug Abuse describes addiction as a chronic, relapsing disorder characterised by compulsive drug seeking and use despite adverse consequences, and notes that it is considered a brain disorder because it involves functional changes to brain circuits involved in reward, stress, and self-control.</p>
              <p>This matters because the way addiction is talked about in everyday life lags decades behind the science. People still think of relapse as weakness. The person living with the disease often thinks of themselves the same way. Both the shame and the willpower-based strategies that follow from it are not just unhelpful, they are actively contraindicated. They make recovery harder. They prolong the disease. They are the wrong tool for the job because they target the wrong layer of the brain.</p>
            </div>
          </div>

          <div className="content-section">
            <div className="section-inner">
              <h2>The genetic foundation</h2>
              <p>Before any environmental input, before any first drink, before any conscious choice, there is a genome. Twin and adoption studies have established for decades that addiction has a substantial heritable component. The heritability of alcohol use disorder is estimated at approximately 50 to 60 percent, placing addiction among the most heritable of psychiatric conditions, comparable to schizophrenia and bipolar disorder <sup>[26,27]</sup>.</p>
              <p>The genetic contribution does not work through a single gene. Genome-wide association studies have identified hundreds of genetic variants that each contribute small effects to addiction risk, with the cumulative effect being substantial <sup>[28,29,30]</sup>. The picture is not one of a single broken gene but of a polygenic susceptibility distributed across many small contributions, each subtly shaping the brain that develops from that genome.</p>
              <p>People who develop severe addictions are not weaker than those who do not. They are working with a brain whose factory settings made the substance more rewarding, the craving more intense, the impulse harder to inhibit, and the eventual habit more deeply encoded. None of this makes the condition uncontrollable. It makes it understandable.</p>
            </div>
          </div>

          <div className="content-section">
            <div className="section-inner">
              <h2>Two layers, one problem</h2>
              <p>The brain is not a single system. For the purposes of understanding addiction, it is useful to think of it as two cooperating systems running on different timescales.</p>
              <p>The first system is the <strong>prefrontal cortex</strong> and its associated networks. This is the part of the brain that handles planning, deliberation, conscious commitment, language-based reasoning, and executive control. It is the part that says "I have decided not to drink." It works on a slow timescale, takes effort to operate, fatigues under stress, and sleeps when you sleep. The prefrontal cortex is also the last region of the brain to fully develop, with maturation continuing into the mid-twenties, and it is among the most vulnerable to chronic stress and substance-induced damage <sup>[5,6]</sup>.</p>
              <p>The second system is older, deeper, and faster. It includes the brainstem, the limbic system, the basal ganglia, and the dopaminergic pathways that connect them. This system handles survival, motivation, threat detection, and the formation of habits. It does not use language. It does not deliberate. It runs on pattern-matching and affect, and it operates in milliseconds. It evolved long before the cortex did, and in any contest of speed or persistence, it wins.</p>

              <div className="network-grid">
                <div className="network-card reflective">
                  <h4>Reflective system</h4>
                  <p>Prefrontal cortex. Goal-directed decisions. Consequence evaluation. Impulse inhibition. Dominant when load is low and headroom is high.</p>
                </div>
                <div className="network-card automatic">
                  <h4>Automatic systems</h4>
                  <p>Amygdala, basal ganglia, nucleus accumbens. Cue-driven responses, stress reactions, habit loops. Gain influence as load rises and headroom shrinks.</p>
                </div>
              </div>

              <p>In a healthy brain, these two systems cooperate. The deeper system flags what matters. The cortex evaluates and decides. Addiction breaks the cooperation. Repeated substance use produces lasting changes in the deeper system that encode the substance as a survival-grade reward on the same priority level as food, water, or escape from a predator <sup>[1,2,3]</sup>. Simultaneously, chronic substance use produces measurable hypofunction in the prefrontal cortex, weakening the very system that would otherwise inhibit the impulse <sup>[4,5]</sup>.</p>
              <p>This is why people who genuinely do not want to drink, drink anyway. The cortex was outvoted before it knew there was a vote.</p>
            </div>
          </div>

          <div className="content-section">
            <div className="section-inner">
              <h2>Why willpower fails</h2>
              <p>Willpower is a cortical strategy. It depends on the slower, deliberative system to override the faster, automatic one. It works when the cortex is well-rested, well-fed, unstressed, well-supported, and operating below its capacity. It fails when any of those conditions degrades.</p>
              <p>This is not a metaphor. It is a measurable phenomenon. Stress is among the most reliable predictors of relapse across substances, with stress-induced craving and prefrontal hypofunction directly observable in neuroimaging studies <sup>[10]</sup>. Sleep deprivation impairs the prefrontal regulation of emotional and reward processing. The cumulative effect of multiple simultaneous stressors degrades inhibitory control more than any single stressor alone, a phenomenon described in the allostatic load framework <sup>[9]</sup>.</p>
              <p>The standard advice given to people in recovery assumes that the cortex can be made strong enough to win every contest with the deeper system. The evidence is overwhelming that it cannot. The cortex is the wrong tool for sustained inhibition of a survival-encoded craving response when that response has been amplified by years of use and embedded in a genome that was already vulnerable.</p>
            </div>
          </div>

          <div className="content-section">
            <div className="section-inner">
              <h2>What recovery actually requires</h2>
              <p>Recovery is not the elimination of the deeper-system pattern. The neural pathways laid down by repeated substance use do not disappear. They become quieter with disuse, they are partially pruned at the edges, they lose some of their automatic priority, but the architecture remains. This is what is meant when addiction is called a chronic disease. Like asthma, hypertension, or type 2 diabetes, it is not cured, it is managed.</p>
              <p>What recovery requires is the construction of conditions under which the deeper-system pattern is rarely activated, and supports for the cortex during the moments when it is. Both pieces matter. Neither alone is sufficient.</p>
              <p>The <strong>conditions side</strong> involves identifying the inputs that load the system: stress, isolation, unresolved emotional weight, poor sleep, nutritional deficits, untreated co-occurring mental health conditions, social environments associated with use, and the slow accumulation of unprocessed daily friction. Each of these inputs adds to a kind of internal pressure. When the pressure crosses a threshold, the deeper system is more likely to fire <sup>[9,10]</sup>.</p>
              <p>The <strong>cortical-support side</strong> involves the things that strengthen and rest the prefrontal system: adequate sleep, regular aerobic exercise, nutrition, social connection, meaningful work, therapy, and any practice that builds the brain's capacity to notice its own state without acting on it.</p>
              <p>These are not soft adjuncts to a willpower-based strategy. They are the actual mechanism by which sustained recovery becomes possible.</p>
            </div>
          </div>

          <div className="content-section">
            <div className="section-inner">
              <h2>What Headroom does</h2>
              <p>Headroom is a tool for the conditions side of the work. It does not try to strengthen the cortex through exhortation. It does not ask the user to commit harder, decide more firmly, or want recovery enough. It assumes the user already wants recovery, and it provides a structure for managing the inputs that determine whether the deeper system is likely to fire.</p>
              <p>Each day, the user tracks both load and relief. The app produces a single visible measure of where they currently sit relative to the threshold at which the deeper system becomes harder to manage. The measure is not a moral judgement. It is not a score. It is a representation of internal pressure relative to the user's own capacity to hold it.</p>
              <p>The space below the threshold is the headroom. The whole working principle of the app is that the headroom is what the user is actually managing. Not the threshold itself, which is biological and largely fixed. Not the desire for the substance, which is a downstream consequence of load and threshold. The headroom. The margin. The space the user keeps clear so that on any given day, the deeper system has no good reason to fire.</p>
              <p>The bucket metaphor is a folk version of the model formalised in the literature as allostatic load, the diathesis-stress framework, and the cumulative risk perspective on relapse. Headroom takes the concept and gives it a daily, visible, actionable form.</p>
            </div>
          </div>

          <div className="content-section">
            <div className="section-inner">
              <h2>Why visibility matters</h2>
              <p>Most people in recovery cannot accurately track their own internal pressure. The deeper system does not produce verbal reports. It produces affect, impulse, irritability, restlessness, fatigue, the sense of something being wrong. By the time these surface as conscious distress, the load is often already high. By the time they surface as craving, it is too late for cortical strategies to be reliable.</p>
              <p>A visible, externalised measure of internal load addresses this directly. It moves the tracking from the deeper system, which cannot speak, to the cortex, which can. It makes the otherwise-invisible pressure available to the deliberative part of the brain at a stage when the deliberative part can still act.</p>
              <p>The user sees their bucket filling on a Tuesday morning and goes for a run, calls a friend, books a counselling session, takes the day off, gets to bed early. They do something that adds to the positives or removes from the negatives, and the load comes down. They never reach the threshold. The deeper system never fires. The day passes uneventfully.</p>
              <p>Without the visible measure, the same Tuesday ends with the user surprised to find themselves at the off-licence at six in the evening with no memory of having decided to go.</p>
              <p>This is the difference Headroom makes. Not stronger willpower. Not deeper commitment. Earlier visibility, and therefore earlier action.</p>
            </div>
          </div>

          <div className="content-section">
            <div className="section-inner">
              <h2>What the app is not</h2>
              <p>Headroom is not a treatment. It does not replace counselling, medical care, medication-assisted recovery, peer support, or any of the established components of addiction treatment. It is a daily management tool that complements them.</p>
              <p>It is also not a solution to the underlying disease. What changes, with consistent use and consistent application of the recovery work it supports, is the frequency and intensity of episodes during which the deeper system fires. For some users, that frequency drops to zero for long periods. For others, it remains rare but possible. Both outcomes are recoveries. Both are managed disease. Neither is failure.</p>
              <p>The app is not for people whose substance use is not yet a problem. It is not a wellness product. It is a tool for people who already know they are managing a chronic condition and who are looking for a structure that does not insult the seriousness of what they are managing.</p>
            </div>
          </div>

          <div className="content-section">
            <div className="section-inner">
              <h2>The claim, plainly</h2>
              <p>Headroom works because it operationalises an accurate model of what addiction is and what recovery requires. It works because it targets the right layer of the brain with the right intervention at the right time. It works because it replaces a story that does not match the biology with one that does, and because the story that matches the biology is also the story that produces sustained recovery.</p>
              <p>It is not magic. It is not a cure. It is a tool that makes the daily work of managing a chronic disease visible, ordinary, and possible.</p>
              <p>That is enough.</p>
            </div>
          </div>

          <div className="content-section">

              <h2>The supported model statement</h2>
              <div className="content-model-statement">
                Relapse is not a single decision. It is a narrowing corridor. Stress and load increase bodily distress and weaken prefrontal inhibitory control. Drug cues and internal states activate hippocampal and amygdala-linked memories of relief. The nucleus accumbens and VTA assign alcohol exaggerated incentive salience: the wanting intensifies without rational basis. The dorsal striatum then supplies the learned route: stand up, get keys, walk to the shop, buy, open, drink. Consciousness may only fully return once the sequence is already running. Recovery therefore depends less on heroic last-second resistance and more on preventing the network from reaching the automatic-habit stage, which is what the daily practice of load monitoring is for.

    function App() {
      const getRoute = () => {
        const hash = window.location.hash.replace('#/', '').replace('#', '');
        return hash || 'home';
      };

      const [route, setRoute] = useState(getRoute);

      useEffect(() => {
        const onHash = () => setRoute(getRoute());
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const navigate = (r) => {
        window.location.hash = `#/${r}`;
        window.scrollTo(0, 0);
      };

      const navLink = (r, label) => (
        <a className={route === r ? 'active' : ''} onClick={() => navigate(r)}>{label}</a>
      );

      let page;
      switch (route) {
        case 'demo': page = <DemoPage />; break;
        case 'about': page = <AboutPage />; break;
        case 'why': page = <WhyPage />; break;
        case 'contact': page = <ContactPage />; break;
        default: page = <LandingPage navigate={navigate} />;
      }

      return (
        <>
          <nav>
            <a className="logo" onClick={() => navigate('home')}>headroom</a>
            <ul className="nav-links">
              <li>{navLink('demo', 'Demo')}</li>
              <li>{navLink('about', 'About')}</li>
              <li>{navLink('why', 'Why it works')}</li>
              <li>{navLink('contact', 'Contact')}</li>
            </ul>
          </nav>
          {page}
          <footer>
            <p>&copy; 2026 Headroom. Built in Nottingham. <a onClick={() => navigate('contact')}>Contact</a></p>
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
