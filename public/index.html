<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Headroom: a personal psychological load management tool built on the stress-bucket model. Know your headroom.">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Headroom | know your headroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --teal: #4fd1c5; --teal-deep: #2c7a7b; --teal-dim: rgba(79,209,197,0.15);
      --amber: #f6ad55; --amber-deep: #c77c2a; --amber-dim: rgba(246,173,85,0.15);
      --coral: #fc8181; --coral-deep: #c53030; --coral-dim: rgba(252,129,129,0.15);
      --bg: #0f172a; --bg-card: #1e293b; --bg-elevated: #273548;
      --text: #e2e8f0; --text-muted: #94a3b8; --text-bright: #f8fafc;
      --border: rgba(79,209,197,0.08); --border-hover: rgba(79,209,197,0.25);
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --danger: #f56565; --success: #48bb78;
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--text); line-height: 1.7; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    #root { min-height: 100vh; }

    /* NAV */
    nav { position: fixed; top: 0; width: 100%; z-index: 100; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; background: rgba(15,23,42,0.88); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
    .logo { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; color: var(--teal); letter-spacing: -0.02em; cursor: pointer; text-decoration: none; }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; cursor: pointer; }
    .nav-links a:hover, .nav-links a.active { color: var(--teal); }
    .nav-user { font-size: 0.85rem; color: var(--teal); }

    /* SHARED */
    .page { padding-top: 70px; min-height: 100vh; }
    .page-section { padding: 5rem 2rem; }
    .page-section + .page-section { border-top: 1px solid var(--border); }
    .section-inner { max-width: 900px; margin: 0 auto; }
    .section-label { font-size: 0.8rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; color: var(--teal); margin-bottom: 1rem; }
    .section-inner h2 { font-family: var(--font-display); font-size: clamp(1.8rem, 3.5vw, 2.4rem); font-weight: 600; color: var(--text-bright); line-height: 1.25; letter-spacing: -0.02em; margin-bottom: 1.5rem; }
    .section-inner p { color: var(--text-muted); font-size: 1.05rem; max-width: 640px; margin-bottom: 1.25rem; }
    .btn-primary { display: inline-block; padding: 0.85rem 2rem; background: var(--teal-deep); color: var(--text-bright); text-decoration: none; font-family: var(--font-body); font-weight: 500; font-size: 1rem; border-radius: 6px; border: 1px solid var(--teal); transition: all 0.25s; cursor: pointer; }
    .btn-primary:hover { background: var(--teal); color: var(--bg); }
    .btn-secondary { display: inline-block; padding: 0.65rem 1.4rem; background: var(--bg-card); color: var(--text); font-family: var(--font-body); font-weight: 500; font-size: 0.9rem; border-radius: 6px; border: 1px solid var(--border); transition: all 0.25s; cursor: pointer; }
    .btn-secondary:hover { border-color: var(--border-hover); }
    .btn-danger { display: inline-block; padding: 0.65rem 1.4rem; background: rgba(245,101,101,0.1); color: var(--coral); font-family: var(--font-body); font-weight: 500; font-size: 0.9rem; border-radius: 6px; border: 1px solid rgba(245,101,101,0.2); cursor: pointer; }

    /* HERO */
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 6rem 2rem 4rem; position: relative; }
    .hero::before { content: ''; position: absolute; top: -20%; right: -10%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(79,209,197,0.06) 0%, transparent 70%); pointer-events: none; }
    .hero-inner { max-width: 1100px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
    .hero-text h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 5vw, 3.8rem); font-weight: 600; color: var(--text-bright); line-height: 1.15; letter-spacing: -0.03em; margin-bottom: 0.5rem; }
    .hero-text .strapline { font-family: var(--font-display); font-style: italic; font-weight: 300; font-size: 1.35rem; color: var(--teal); margin-bottom: 2rem; opacity: 0; animation: fadeUp 0.8s ease 0.3s forwards; }
    .hero-text p { font-size: 1.1rem; color: var(--text-muted); max-width: 480px; margin-bottom: 2.5rem; opacity: 0; animation: fadeUp 0.8s ease 0.5s forwards; }
    .hero .btn-primary { opacity: 0; animation: fadeUp 0.8s ease 0.7s forwards; }
    .hero-bucket { display: flex; justify-content: center; align-items: center; opacity: 0; animation: fadeIn 1.2s ease 0.4s forwards; }

    /* CONCEPT CARDS */
    .concept-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 3rem; }
    .concept-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 2rem 1.5rem; transition: border-color 0.3s, transform 0.3s; }
    .concept-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
    .card-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; font-size: 1.3rem; }
    .card-icon.teal { background: var(--teal-dim); } .card-icon.amber { background: var(--amber-dim); } .card-icon.coral { background: var(--coral-dim); }
    .concept-card h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; color: var(--text-bright); margin-bottom: 0.6rem; }
    .concept-card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; }
    .origin-quote { font-family: var(--font-display); font-style: italic; font-weight: 300; font-size: 1.3rem; color: var(--text); border-left: 3px solid var(--teal); padding-left: 1.5rem; margin: 2rem 0; max-width: 580px; }
    .cta-section { text-align: center; } .cta-section .section-inner { display: flex; flex-direction: column; align-items: center; } .cta-section p { text-align: center; }
    footer { padding: 2.5rem 2rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border); }
    footer a { color: var(--teal); text-decoration: none; cursor: pointer; }

    /* DEMO */
    .demo-page { padding-top: 70px; min-height: 100vh; }
    .demo-layout { max-width: 1100px; margin: 0 auto; padding: 2rem; display: grid; grid-template-columns: 300px 1fr; gap: 2.5rem; align-items: start; }
    .bucket-panel { position: sticky; top: 90px; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .bucket-svg-wrap { transition: filter 0.5s; }
    .level-reading { font-family: var(--font-display); font-size: 2.8rem; font-weight: 600; letter-spacing: -0.03em; transition: color 0.5s; }
    .level-label { font-size: 0.85rem; color: var(--text-muted); margin-top: -0.5rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .headroom-reading { font-family: var(--font-display); font-style: italic; font-weight: 300; font-size: 1.1rem; color: var(--text-muted); }
    .reset-btn { background: none; border: 1px solid rgba(148,163,184,0.2); color: var(--text-muted); font-family: var(--font-body); font-size: 0.8rem; padding: 0.4rem 1rem; border-radius: 4px; cursor: pointer; transition: all 0.2s; margin-top: 0.25rem; }
    .reset-btn:hover { border-color: var(--coral); color: var(--coral); }
    .items-panel { display: flex; flex-direction: column; gap: 2rem; }
    .item-group h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .item-group h3 .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .item-group.fillers h3 { color: var(--coral); } .item-group.fillers .dot { background: var(--coral); }
    .item-group.emptiers h3 { color: var(--teal); } .item-group.emptiers .dot { background: var(--teal); }
    .items-grid { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .item-btn { padding: 0.6rem 1.1rem; border-radius: 6px; font-family: var(--font-body); font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; border: 1px solid; user-select: none; }
    .item-btn.filler { background: var(--coral-dim); border-color: rgba(252,129,129,0.2); color: var(--coral); }
    .item-btn.filler:hover { background: rgba(252,129,129,0.25); border-color: var(--coral); transform: translateY(-1px); }
    .item-btn.emptier { background: var(--teal-dim); border-color: rgba(79,209,197,0.2); color: var(--teal); }
    .item-btn.emptier:hover { background: rgba(79,209,197,0.25); border-color: var(--teal); transform: translateY(-1px); }
    .item-btn:active { transform: scale(0.96); }
    .item-btn .impact { font-size: 0.75rem; opacity: 0.6; margin-left: 0.3rem; }
    .item-btn.tapped { animation: tapPulse 0.3s ease; }
    @keyframes tapPulse { 0% { transform: scale(1); } 50% { transform: scale(0.93); } 100% { transform: scale(1); } }
    .history-section { margin-top: 0.5rem; }
    .history-section h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; color: var(--text-bright); margin-bottom: 1rem; }
    .history-chart-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .history-log-wrap { position: relative; max-height: 320px; overflow: hidden; }
    .history-log-wrap::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40px; background: linear-gradient(transparent, var(--bg)); pointer-events: none; z-index: 1; }
    .history-log { display: flex; flex-direction: column; gap: 0.35rem; max-height: 320px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--bg-elevated) var(--bg-card); padding-bottom: 2.5rem; }
    .log-entry { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.88rem; background: var(--bg-card); border: 1px solid var(--border); }
    .log-entry .time { color: var(--text-muted); font-size: 0.8rem; min-width: 44px; font-variant-numeric: tabular-nums; }
    .log-entry .label { flex: 1; color: var(--text); }
    .log-entry .delta { font-weight: 600; font-size: 0.85rem; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
    .log-entry .delta.up { color: var(--coral); } .log-entry .delta.down { color: var(--teal); }
    .log-entry .level-after { color: var(--text-muted); font-size: 0.8rem; min-width: 32px; text-align: right; }
    .demo-banner { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0.75rem 2rem; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
    .demo-banner strong { color: var(--amber); font-weight: 500; }

    /* AUTH FORMS */
    .auth-page { padding-top: 70px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 420px; margin: 2rem; }
    .auth-card h1 { font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; color: var(--text-bright); margin-bottom: 0.5rem; }
    .auth-card .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.4rem; }
    .form-group input { width: 100%; padding: 0.75rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text-bright); font-family: var(--font-body); font-size: 1rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--teal); }
    .form-error { color: var(--coral); font-size: 0.85rem; margin-top: 0.4rem; }
    .form-submit { width: 100%; margin-top: 0.5rem; }
    .form-footer { text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem; }
    .form-footer a { color: var(--teal); cursor: pointer; text-decoration: none; }
    .consent-text { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; margin: 1rem 0; padding: 1rem; background: var(--bg); border-radius: 6px; max-height: 120px; overflow-y: auto; }
    .alert { padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.9rem; margin-bottom: 1rem; }
    .alert-error { background: rgba(245,101,101,0.1); border: 1px solid rgba(245,101,101,0.2); color: var(--coral); }
    .alert-success { background: rgba(72,187,120,0.1); border: 1px solid rgba(72,187,120,0.2); color: var(--success); }

    /* ONBOARDING */
    .onboarding-page { padding-top: 70px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 6rem 2rem 4rem; }
    .onboarding-card { max-width: 700px; width: 100%; }
    .onboarding-card h1 { font-family: var(--font-display); font-size: 2rem; font-weight: 600; color: var(--text-bright); margin-bottom: 0.5rem; }
    .onboarding-card .subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 1rem; }
    .onboard-items { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.5rem; }
    .onboard-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.9rem; border: 1px solid; cursor: pointer; transition: all 0.2s; user-select: none; }
    .onboard-item.filler { border-color: rgba(252,129,129,0.3); color: var(--coral); }
    .onboard-item.emptier { border-color: rgba(79,209,197,0.3); color: var(--teal); }
    .onboard-item.selected { background: var(--bg-card); }
    .onboard-item.deselected { opacity: 0.35; }
    .onboard-item .val { font-size: 0.75rem; opacity: 0.6; }

    /* APP LAYOUT */
    .app-page { padding-top: 70px; min-height: 100vh; }
    .app-layout { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem; display: grid; grid-template-columns: 280px 1fr; gap: 2rem; align-items: start; }
    .app-subnav { display: flex; gap: 1rem; padding: 0.75rem 2rem; border-bottom: 1px solid var(--border); background: var(--bg-card); }
    .app-subnav a { color: var(--text-muted); text-decoration: none; font-size: 0.88rem; font-weight: 500; padding: 0.4rem 0; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
    .app-subnav a.active { color: var(--teal); border-bottom-color: var(--teal); }
    .app-content { max-width: 800px; margin: 0 auto; padding: 2rem; }

    /* SETTINGS / ADMIN */
    .settings-section { margin-bottom: 2.5rem; }
    .settings-section h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; color: var(--text-bright); margin-bottom: 1rem; }
    .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
    .settings-row label { color: var(--text); font-size: 0.95rem; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; text-align: center; }
    .stat-card .num { font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; color: var(--teal); }
    .stat-card .lbl { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }
    .user-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .user-table th { text-align: left; padding: 0.6rem 0.75rem; color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--border); }
    .user-table td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); color: var(--text); }

    /* SHARE LINK DISPLAY */
    .share-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 1rem; }
    .share-item .share-label { font-weight: 500; color: var(--text-bright); flex: 1; }
    .share-url { font-size: 0.8rem; color: var(--teal); word-break: break-all; }

    /* PATTERNS */
    .patterns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
    .pattern-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; }
    .pattern-card h4 { font-family: var(--font-display); font-weight: 600; font-size: 1rem; color: var(--text-bright); margin-bottom: 1rem; }
    .pattern-bar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; font-size: 0.88rem; }
    .pattern-bar .bar-label { min-width: 120px; color: var(--text); }
    .pattern-bar .bar-fill { height: 20px; border-radius: 3px; transition: width 0.5s; }
    .pattern-bar .bar-val { min-width: 40px; color: var(--text-muted); font-size: 0.8rem; text-align: right; }

    /* LOADING */
    .loading { display: flex; align-items: center; justify-content: center; padding: 4rem; color: var(--text-muted); font-style: italic; }

    /* ENTRY DELETE */
    .log-entry .delete-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; padding: 0.2rem 0.4rem; opacity: 0.3; transition: all 0.2s; }
    .log-entry:hover .delete-btn { opacity: 1; }
    .log-entry .delete-btn:hover { color: var(--coral); }

    /* ITEM ROWS (always-visible management like prototype) */
    .item-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.5rem; }
    .item-tap { flex: 1; display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 1rem; border-radius: 6px; cursor: pointer; transition: all 0.2s; border: 1px solid; user-select: none; }
    .item-tap.filler { background: var(--bg-card); border-color: rgba(252,129,129,0.15); }
    .item-tap.filler:hover { background: var(--coral-dim); border-color: rgba(252,129,129,0.3); }
    .item-tap.emptier { background: var(--bg-card); border-color: rgba(79,209,197,0.15); }
    .item-tap.emptier:hover { background: var(--teal-dim); border-color: rgba(79,209,197,0.3); }
    .item-tap.tapped { animation: tapPulse 0.3s ease; }
    .item-tap .item-label { flex: 1; font-size: 0.92rem; color: var(--text); }
    .item-tap .item-value { font-size: 0.85rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 4px; font-variant-numeric: tabular-nums; }
    .item-tap.filler .item-value { color: var(--coral); background: var(--coral-dim); }
    .item-tap.emptier .item-value { color: var(--teal); background: var(--teal-dim); }
    .item-edit-btn, .item-rm-btn { background: none; border: none; cursor: pointer; font-size: 0.95rem; padding: 0.4rem; opacity: 0.25; transition: all 0.2s; color: var(--text-muted); }
    .item-edit-btn:hover { opacity: 1; color: var(--teal); }
    .item-rm-btn:hover { opacity: 1; color: var(--coral); }
    .item-row:hover .item-edit-btn, .item-row:hover .item-rm-btn { opacity: 0.6; }
    .add-item-btn { background: none; border: 1px dashed var(--border); border-radius: 6px; padding: 0.5rem 1rem; color: var(--text-muted); cursor: pointer; font-family: var(--font-body); font-size: 0.85rem; margin-top: 0.5rem; transition: all 0.2s; width: 100%; text-align: center; }
    .add-item-btn:hover { border-color: var(--teal); color: var(--teal); }

    /* ITEM EDIT/ADD ROW */
    .item-manage { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; background: var(--bg-card); border: 1px solid var(--border-hover); border-radius: 6px; margin-bottom: 0.5rem; }
    .item-manage .lbl-input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.4rem 0.6rem; color: var(--text); font-family: var(--font-body); font-size: 0.88rem; outline: none; }
    .item-manage .lbl-input:focus { border-color: var(--teal); }
    .item-manage .val-input { width: 55px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.4rem 0.5rem; color: var(--text); font-family: var(--font-body); font-size: 0.88rem; text-align: center; outline: none; }
    .item-manage .val-input:focus { border-color: var(--teal); }
    .item-manage .rm-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; padding: 0.2rem; opacity: 0.5; transition: all 0.2s; }
    .item-manage .rm-btn:hover { color: var(--coral); opacity: 1; }
    .item-manage .add-btn { background: none; border: 1px solid var(--teal); border-radius: 4px; padding: 0.35rem 0.75rem; color: var(--teal); cursor: pointer; font-size: 0.85rem; font-family: var(--font-body); transition: all 0.2s; }
    .item-manage .add-btn:hover { background: var(--teal-dim); }

    /* ANIMATIONS */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .demo-layout, .app-layout { grid-template-columns: 1fr; gap: 1.5rem; }
      .bucket-panel { position: relative; top: 0; flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .bucket-panel svg { width: 140px; height: auto; }
      .level-reading { font-size: 2rem; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .patterns-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      nav { padding: 0.75rem 1.25rem; } .nav-links { gap: 0.8rem; } .nav-links a { font-size: 0.8rem; }
      .hero { padding: 5rem 1.5rem 3rem; } .hero-inner { grid-template-columns: 1fr; gap: 3rem; text-align: center; }
      .hero-text p { max-width: 100%; } .hero-bucket { order: -1; }
      .concept-grid { grid-template-columns: 1fr; }
      .page-section, .app-content { padding: 2rem 1.25rem; }
      .app-subnav { gap: 0.5rem; padding: 0.75rem 1rem; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    // ═══════════════════════════════════════
    // API HELPER
    // ═══════════════════════════════════════
    async function api(path, opts = {}) {
      const res = await fetch(`/api${path}`, {
        headers: { 'Content-Type': 'application/json', ...opts.headers },
        credentials: 'same-origin',
        ...opts,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    // ═══════════════════════════════════════
    // BUCKET MODEL
    // ═══════════════════════════════════════
    function bucketFillY(level) {
      const L = Math.max(0, Math.min(100, level)) / 100;
      if (L <= 0) return 188;
      const fillH = (-98 + Math.sqrt(9604 + 11712 * L)) / 0.32;
      return 188 - Math.min(fillH, 140);
    }
    function levelColor(level) {
      if (level <= 40) return { main: '#4fd1c5', glow: 'rgba(79,209,197,0.15)' };
      if (level <= 70) return { main: '#f6ad55', glow: 'rgba(246,173,85,0.15)' };
      return { main: '#fc8181', glow: 'rgba(252,129,129,0.15)' };
    }
    function levelWord(level) {
      if (level <= 20) return 'calm'; if (level <= 40) return 'settled'; if (level <= 55) return 'building';
      if (level <= 70) return 'elevated'; if (level <= 85) return 'high'; return 'critical';
    }

    // ═══════════════════════════════════════
    // BUCKET SVG
    // ═══════════════════════════════════════
    function BucketSVG({ level, size = 1 }) {
      const wY = bucketFillY(level);
      const fillHeight = 188 - wY;
      const col = levelColor(level);
      const leftX = 52 + (40 - 52) * (wY - 188) / (48 - 188);
      const rightX = 148 + (160 - 148) * (wY - 188) / (48 - 188);
      const gid = `bF${Math.round(level)}`;
      return (
        <div className="bucket-svg-wrap" style={{ filter: `drop-shadow(0 0 30px ${col.glow})` }}>
          <svg viewBox="0 0 200 220" width={220*size} height={286*size} xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="bClip"><polygon points="40,48 160,48 148,188 52,188" /></clipPath>
              <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={col.main} stopOpacity="0.75" />
                <stop offset="100%" stopColor={col.main} stopOpacity="0.3" />
              </linearGradient>
            </defs>
            <line x1="52" y1="118" x2="148" y2="118" stroke="rgba(148,163,184,0.12)" strokeWidth="1" strokeDasharray="6 4" />
            <rect x="30" y={wY} width="140" height={fillHeight} fill={`url(#${gid})`} clipPath="url(#bClip)" style={{ transition: 'y 0.6s cubic-bezier(0.4,0,0.2,1), height 0.6s cubic-bezier(0.4,0,0.2,1)' }} />
            {level > 0 && <line x1={leftX} y1={wY} x2={rightX} y2={wY} stroke={col.main} strokeWidth="1.5" strokeOpacity="0.5" style={{ transition: 'all 0.6s' }} />}
            <polygon points="40,48 160,48 148,188 52,188" fill="none" stroke={col.main} strokeWidth="2.5" strokeLinejoin="round" style={{ transition: 'stroke 0.5s' }} />
            <line x1="32" y1="48" x2="168" y2="48" stroke={col.main} strokeWidth="3" strokeLinecap="round" style={{ transition: 'stroke 0.5s' }} />
          </svg>
        </div>
      );
    }

    // ═══════════════════════════════════════
    // HISTORY CHART
    // ═══════════════════════════════════════
    function HistoryChart({ entries }) {
      if (!entries || entries.length < 2) return null;
      const W = 520, H = 140, PAD = { t: 10, r: 15, b: 25, l: 35 };
      const plotW = W - PAD.l - PAD.r, plotH = H - PAD.t - PAD.b;
      const pts = entries.map(e => ({ t: new Date(e.loggedAt || e.logged_at || e.ts).getTime(), level: e.levelAfter ?? e.level_after ?? e.level }));
      const tMin = Math.min(...pts.map(p=>p.t)), tMax = Math.max(...pts.map(p=>p.t)), tRange = tMax - tMin || 1;
      const points = pts.map(p => ({ x: PAD.l + ((p.t - tMin) / tRange) * plotW, y: PAD.t + (1 - p.level / 100) * plotH, level: p.level }));
      const line = points.map((p, i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      const area = line + ` L${points[points.length-1].x.toFixed(1)},${PAD.t+plotH} L${points[0].x.toFixed(1)},${PAD.t+plotH} Z`;
      return (
        <div className="history-chart-wrap">
          <svg viewBox={`0 0 ${W} ${H}`} width="100%" preserveAspectRatio="xMidYMid meet">
            <defs><linearGradient id="aG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#4fd1c5" stopOpacity="0.2" /><stop offset="100%" stopColor="#4fd1c5" stopOpacity="0.02" /></linearGradient></defs>
            {[0,25,50,75,100].map(v => { const y = PAD.t + (1-v/100)*plotH; return <g key={v}><line x1={PAD.l} y1={y} x2={W-PAD.r} y2={y} stroke="rgba(148,163,184,0.08)" /><text x={PAD.l-6} y={y+3} textAnchor="end" fontSize="9" fill="#94a3b8" fontFamily="DM Sans">{v}</text></g>; })}
            <path d={area} fill="url(#aG)" /><path d={line} fill="none" stroke="#4fd1c5" strokeWidth="2" strokeLinejoin="round" />
            {points.map((p,i) => <circle key={i} cx={p.x} cy={p.y} r="3" fill={levelColor(p.level).main} stroke="#0f172a" strokeWidth="1.5" />)}
          </svg>
        </div>
      );
    }

    // ═══════════════════════════════════════
    // LOGIN PAGE
    // ═══════════════════════════════════════
    function LoginPage({ navigate, onAuth }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const handleSubmit = async (e) => {
        e.preventDefault(); setError(''); setLoading(true);
        try {
          const data = await api('/auth/login', { method: 'POST', body: { email, password } });
          onAuth(data.user);
        } catch (err) { setError(err.message); } finally { setLoading(false); }
      };
      return (
        <div className="auth-page"><div className="auth-card">
          <h1>Log in</h1><p className="subtitle">Welcome back.</p>
          {error && <div className="alert alert-error">{error}</div>}
          <form onSubmit={handleSubmit}>
            <div className="form-group"><label>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required autoFocus /></div>
            <div className="form-group"><label>Password</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} required /></div>
            <button type="submit" className="btn-primary form-submit" disabled={loading}>{loading ? 'Logging in...' : 'Log in'}</button>
          </form>
          <div className="form-footer"><a onClick={()=>navigate('register')}>Create an account</a></div>
        </div></div>
      );
    }

    // ═══════════════════════════════════════
    // REGISTER PAGE
    // ═══════════════════════════════════════
    function RegisterPage({ navigate, onAuth }) {
      const [email, setEmail] = useState(''); const [password, setPassword] = useState(''); const [name, setName] = useState('');
      const [error, setError] = useState(''); const [loading, setLoading] = useState(false);
      const handleSubmit = async (e) => {
        e.preventDefault(); setError(''); setLoading(true);
        try {
          const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
          const data = await api('/auth/register', { method: 'POST', body: { email, password, displayName: name || undefined, timezone: tz } });
          onAuth(data.user);
        } catch (err) { setError(err.message); } finally { setLoading(false); }
      };
      return (
        <div className="auth-page"><div className="auth-card">
          <h1>Create account</h1><p className="subtitle">Start knowing your headroom.</p>
          {error && <div className="alert alert-error">{error}</div>}
          <form onSubmit={handleSubmit}>
            <div className="form-group"><label>Name (optional)</label><input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="How you'd like to be called" /></div>
            <div className="form-group"><label>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required /></div>
            <div className="form-group"><label>Password (8+ characters)</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} required minLength={8} /></div>
            <div className="consent-text">By creating an account you agree that Headroom will store your email address, an encrypted version of your password, and the bucket entries you log. This data is used solely to provide the service. You can export or permanently delete all your data at any time from your account settings.</div>
            <button type="submit" className="btn-primary form-submit" disabled={loading}>{loading ? 'Creating...' : 'Create account'}</button>
          </form>
          <div className="form-footer"><a onClick={()=>navigate('login')}>Already have an account? Log in</a></div>
        </div></div>
      );
    }

    // ═══════════════════════════════════════
    // ONBOARDING
    // ═══════════════════════════════════════
    function OnboardingPage({ onComplete }) {
      const [starters, setStarters] = useState(null);
      const [selected, setSelected] = useState(new Set());
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      useEffect(() => {
        api('/onboarding/starters').then(data => {
          const all = [
            ...data.fillers.map((f,i) => ({ ...f, type: 'filler', key: `f${i}` })),
            ...data.emptiers.map((e,i) => ({ ...e, type: 'emptier', key: `e${i}` })),
          ];
          setStarters(all);
          // Start with nothing selected. User taps to include.
        });
      }, []);

      const toggle = (key) => {
        setSelected(prev => { const n = new Set(prev); n.has(key) ? n.delete(key) : n.add(key); return n; });
      };

      const selectAll = (type) => {
        setSelected(prev => {
          const n = new Set(prev);
          starters.filter(s => s.type === type).forEach(s => n.add(s.key));
          return n;
        });
      };

      const handleComplete = async () => {
        const items = starters.filter(s => selected.has(s.key)).map(s => ({ label: s.label, type: s.type, defaultValue: s.defaultValue }));
        if (items.filter(i=>i.type==='filler').length === 0 || items.filter(i=>i.type==='emptier').length === 0) {
          setError('Select at least one from each group.'); return;
        }
        setLoading(true); setError('');
        try {
          await api('/onboarding/complete', { method: 'POST', body: { items } });
          onComplete();
        } catch (err) { setError(err.message); } finally { setLoading(false); }
      };

      if (!starters) return <div className="loading">Loading...</div>;
      const fillers = starters.filter(s => s.type === 'filler');
      const emptiers = starters.filter(s => s.type === 'emptier');
      const selCount = selected.size;
      return (
        <div className="onboarding-page"><div className="onboarding-card">
          <h1>Choose your items</h1>
          <p className="subtitle">Tap each item that applies to you. These are the stressors that fill your bucket and the actions that drain it. You can add, edit, or remove them at any time.</p>
          {error && <div className="alert alert-error">{error}</div>}
          <div className="item-group fillers"><h3><span className="dot"></span> What fills your bucket? <button className="manage-toggle" onClick={()=>selectAll('filler')} style={{marginLeft:'auto',background:'none',border:'none',color:'var(--text-muted)',cursor:'pointer',fontSize:'0.8rem'}}>Select all</button></h3>
            <div className="onboard-items">{fillers.map(f => (
              <div key={f.key} className={`onboard-item filler ${selected.has(f.key)?'selected':'deselected'}`} onClick={()=>toggle(f.key)}>
                {f.label} <span className="val">+{f.defaultValue}</span>
              </div>
            ))}</div>
          </div>
          <div className="item-group emptiers"><h3><span className="dot"></span> What helps bring it down? <button className="manage-toggle" onClick={()=>selectAll('emptier')} style={{marginLeft:'auto',background:'none',border:'none',color:'var(--text-muted)',cursor:'pointer',fontSize:'0.8rem'}}>Select all</button></h3>
            <div className="onboard-items">{emptiers.map(e => (
              <div key={e.key} className={`onboard-item emptier ${selected.has(e.key)?'selected':'deselected'}`} onClick={()=>toggle(e.key)}>
                {e.label} <span className="val">-{e.defaultValue}</span>
              </div>
            ))}</div>
          </div>
          <button className="btn-primary" onClick={handleComplete} disabled={loading || selCount === 0} style={{marginTop:'1.5rem'}}>
            {loading ? 'Setting up...' : selCount === 0 ? 'Select items to continue' : `Continue with ${selCount} items`}
          </button>
        </div></div>
      );
    }

    // ═══════════════════════════════════════
    // APP BUCKET VIEW (main daily screen)
    // ═══════════════════════════════════════
    function AppBucket({ user }) {
      const [level, setLevel] = useState(0);
      const [items, setItems] = useState([]);
      const [todayEntries, setTodayEntries] = useState([]);
      const [tapped, setTapped] = useState(null);
      const [loading, setLoading] = useState(true);
      const [editing, setEditing] = useState(null); // item id being edited
      const [adding, setAdding] = useState(null); // 'filler' or 'emptier'
      const [addLabel, setAddLabel] = useState('');
      const [addVal, setAddVal] = useState(10);
      const logRef = useRef(null);

      const load = useCallback(async () => {
        try {
          const [b, it, te] = await Promise.all([api('/bucket'), api('/items'), api('/entries/today')]);
          setLevel(b.level); setItems(it.items); setTodayEntries(te.entries);
        } catch(e) { console.error(e); } finally { setLoading(false); }
      }, []);

      useEffect(() => { load(); }, [load]);

      const handleTap = async (item) => {
        if (editing === item.id) return;
        try {
          const data = await api('/entries', { method: 'POST', body: { itemId: item.id } });
          setLevel(data.level);
          setTodayEntries(prev => [...prev, { id: data.entry.id, label: item.label, type: item.type, value: data.entry.value, levelAfter: data.entry.levelAfter, loggedAt: data.entry.loggedAt }]);
          setTapped(item.id); setTimeout(() => setTapped(null), 300);
          setTimeout(() => { if (logRef.current) logRef.current.scrollTop = 0; }, 50);
        } catch(e) { console.error(e); }
      };

      const handleDeleteEntry = async (entryId) => {
        try {
          await api(`/entries/${entryId}`, { method: 'DELETE' });
          const [b, te] = await Promise.all([api('/bucket'), api('/entries/today')]);
          setLevel(b.level); setTodayEntries(te.entries);
        } catch(e) { console.error(e); }
      };

      const handleEditItem = async (itemId, label, val) => {
        try {
          await api(`/items/${itemId}`, { method: 'PUT', body: { label, defaultValue: parseInt(val) } });
          setItems(prev => prev.map(i => i.id === itemId ? { ...i, label, default_value: parseInt(val) } : i));
          setEditing(null);
        } catch(e) { console.error(e); }
      };

      const handleRemoveItem = async (itemId) => {
        try {
          await api(`/items/${itemId}`, { method: 'DELETE' });
          setItems(prev => prev.filter(i => i.id !== itemId));
        } catch(e) { console.error(e); }
      };

      const handleAddItem = async (type) => {
        if (!addLabel.trim()) return;
        try {
          const data = await api('/items', { method: 'POST', body: { label: addLabel.trim(), type, defaultValue: addVal } });
          setItems(prev => [...prev, data.item]);
          setAddLabel(''); setAddVal(10); setAdding(null);
        } catch(e) { alert(e.message); }
      };

      if (loading) return <div className="loading">Loading your bucket...</div>;
      const col = levelColor(level);
      const fillers = items.filter(i => i.type === 'filler');
      const emptiers = items.filter(i => i.type === 'emptier');
      const displayEntries = [...todayEntries].reverse();
      const formatTime = (ts) => new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

      const ItemRow = ({ item, type }) => {
        const [editLabel, setEditLabel] = useState(item.label);
        const [editVal, setEditVal] = useState(item.default_value);
        const isEditing = editing === item.id;

        if (isEditing) {
          return (
            <div className="item-manage">
              <input className="lbl-input" value={editLabel} onChange={e=>setEditLabel(e.target.value)} autoFocus />
              <input className="val-input" type="number" min="1" max="50" value={editVal} onChange={e=>setEditVal(parseInt(e.target.value)||1)} />
              <button className="add-btn" onClick={()=>handleEditItem(item.id, editLabel, editVal)}>Save</button>
              <button className="rm-btn" onClick={()=>setEditing(null)}>&#x2715;</button>
            </div>
          );
        }

        return (
          <div className={`item-row ${type}`}>
            <div className={`item-tap ${type}${tapped===item.id?' tapped':''}`} onClick={()=>handleTap(item)}>
              <span className="item-label">{item.label}</span>
              <span className="item-value">{type==='filler'?'+':'-'}{item.default_value}</span>
            </div>
            <button className="item-edit-btn" onClick={()=>setEditing(item.id)} title="Edit">&#x270E;</button>
            <button className="item-rm-btn" onClick={()=>handleRemoveItem(item.id)} title="Remove">&#x2715;</button>
          </div>
        );
      };

      const renderGroup = (groupItems, type) => (
        <div>
          {groupItems.map(item => <ItemRow key={item.id} item={item} type={type} />)}
          {adding === type ? (
            <div className="item-manage" style={{marginTop:'0.5rem'}}>
              <input className="lbl-input" placeholder={type==='filler'?'New stressor...':'New relief...'} value={addLabel} onChange={e=>setAddLabel(e.target.value)} autoFocus />
              <input className="val-input" type="number" min="1" max="50" value={addVal} onChange={e=>setAddVal(parseInt(e.target.value)||1)} />
              <button className="add-btn" onClick={()=>handleAddItem(type)}>Add</button>
              <button className="rm-btn" onClick={()=>{setAdding(null);setAddLabel('');setAddVal(10);}}>&#x2715;</button>
            </div>
          ) : (
            <button className="add-item-btn" onClick={()=>{setAdding(type);setAddLabel('');setAddVal(10);}}>+ add</button>
          )}
        </div>
      );

      return (
        <div className="app-layout">
          <div className="bucket-panel">
            <BucketSVG level={level} size={1} />
            <div style={{textAlign:'center'}}>
              <div className="level-reading" style={{color:col.main}}>{Math.round(level)}%</div>
              <div className="level-label">{levelWord(level)}</div>
              <div className="headroom-reading">{100-Math.round(level)}% headroom</div>
            </div>
          </div>
          <div className="items-panel">
            {todayEntries.length === 0 && level === 0 && (
              <div style={{background:'var(--bg-card)',border:'1px solid var(--teal-dim)',borderRadius:'10px',padding:'1.25rem 1.5rem',marginBottom:'1.5rem'}}>
                <p style={{color:'var(--teal)',fontFamily:'var(--font-display)',fontWeight:600,fontSize:'1rem',marginBottom:'0.5rem'}}>How to use Headroom</p>
                <p style={{color:'var(--text-muted)',fontSize:'0.9rem',lineHeight:'1.6',margin:0}}>Start your day by tapping the <strong style={{color:'var(--coral)'}}>load</strong> items that apply right now: work pressure, poor sleep, whatever you carry. Your level will rise. Then through the day, tap <strong style={{color:'var(--teal)'}}>relief</strong> items as you do them: exercise, rest, conversation. Watch the level come down. The space between your level and the top is your headroom.</p>
              </div>
            )}
            <div className="item-group fillers"><h3><span className="dot"></span> Load</h3>
              {renderGroup(fillers, 'filler')}
            </div>
            <div className="item-group emptiers"><h3><span className="dot"></span> Relief</h3>
              {renderGroup(emptiers, 'emptier')}
            </div>
            {todayEntries.length > 0 && (
              <div className="history-section"><h3>Today</h3>
                <HistoryChart entries={todayEntries} />
                <div className="history-log-wrap"><div className="history-log" ref={logRef}>
                  {displayEntries.map(e => (
                    <div className="log-entry" key={e.id}>
                      <span className="time">{formatTime(e.loggedAt)}</span>
                      <span className="label">{e.label}</span>
                      <span className={`delta ${e.value>0?'up':'down'}`}>{e.value>0?'+':''}{e.value}</span>
                      <span className="level-after">{e.levelAfter}%</span>
                      <button className="delete-btn" onClick={()=>handleDeleteEntry(e.id)} title="Delete">&#x2715;</button>
                    </div>
                  ))}
                </div></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════
    // APP HISTORY
    // ═══════════════════════════════════════
    function AppHistory() {
      const [entries, setEntries] = useState([]); const [days, setDays] = useState(7); const [loading, setLoading] = useState(true);
      const load = async (d) => { setLoading(true); try { const data = await api(`/entries?days=${d}`); setEntries(data.entries); } catch(e){} finally { setLoading(false); } };
      useEffect(() => { load(days); }, [days]);
      const handleDelete = async (id) => {
        try { await api(`/entries/${id}`, { method: 'DELETE' }); load(days); } catch(e) { console.error(e); }
      };
      const fmtTime = (ts) => { const d = new Date(ts); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); };
      return (
        <div className="app-content">
          <h2 style={{fontFamily:'var(--font-display)',color:'var(--text-bright)',marginBottom:'1rem'}}>History</h2>

    function AppPatterns() {

    const DEMO_FILLERS = [{id:1,label:'Work pressure',value:12},{id:2,label:'Financial worry',value:18},{id:3,label:'Poor sleep',value:10},{id:4,label:'Family conflict',value:15},{id:5,label:'Health concern',value:11},{id:6,label:'Isolation',value:8},{id:7,label:'Rumination',value:9}];

    function buildSeedHistory(){const n=Date.now(),h=36e5,d=864e5,e=[];let l=0;const g=(o,la,de)=>{l=Math.max(0,Math.min(100,l+de));e.push({id:e.length+1,ts:new Date(n-o).toISOString(),label:la,delta:de,level:l,type:de>0?'filler':'emptier'});};g(2*d+10*h,'Work pressure',12);g(2*d+9.8*h,'Financial worry',18);g(2*d+9.5*h,'Poor sleep',10);g(2*d+9*h,'Family conflict',15);g(2*d+5*h,'Exercise',-14);g(2*d+3*h,'Structured task',-8);g(2*d+1*h,'Good conversation',-11);g(2*d+.5*h,'Rest',-10);g(d+10*h,'Financial worry',18);g(d+9.5*h,'Work pressure',12);g(d+9*h,'Rumination',9);g(d+8.5*h,'Health concern',11);g(d+5*h,'Time outdoors',-9);g(d+3*h,'Exercise',-14);g(d+h,'Music / creativity',-7);g(8*h,'Work pressure',12);g(7.5*h,'Family conflict',15);g(7*h,'Poor sleep',10);g(4*h,'Exercise',-14);g(2*h,'Good conversation',-11);return{entries:e,level:l};}

    function DemoPage() {
      const seed = useMemo(()=>buildSeedHistory(),[]);
      const [level,setLevel]=useState(seed.level);const [entries,setEntries]=useState(seed.entries);const [tapped,setTapped]=useState(null);const logRef=useRef(null);
      const handleItem=(item,type)=>{const delta=type==='filler'?item.value:-item.value;const nl=Math.max(0,Math.min(100,level+delta));setLevel(nl);setEntries(p=>[...p,{id:Date.now(),ts:new Date().toISOString(),label:item.label,delta,level:nl,type}]);setTapped(item.id);setTimeout(()=>setTapped(null),300);setTimeout(()=>{if(logRef.current)logRef.current.scrollTop=0;},50);};
      const handleReset=()=>{const s=buildSeedHistory();setLevel(s.level);setEntries(s.entries);};
      const col=levelColor(level);const fmtTime=(ts)=>{const d=new Date(ts);const diff=Math.floor((Date.now()-d)/864e5);if(diff===0)return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});if(diff===1)return'yday';return`${diff}d`;};
      return (
        <div className="demo-page"><div className="demo-banner"><strong>Demo</strong> / Tap items to see the bucket respond. Data resets on reload.</div>
        <div className="demo-layout"><div className="bucket-panel"><BucketSVG level={level} size={1.1} /><div style={{textAlign:'center'}}><div className="level-reading" style={{color:col.main}}>{Math.round(level)}%</div><div className="level-label">{levelWord(level)}</div><div className="headroom-reading">{100-Math.round(level)}% headroom</div></div><button className="reset-btn" onClick={handleReset}>Reset demo</button></div>
        <div className="items-panel"><div className="item-group fillers"><h3><span className="dot"></span> Load</h3><div className="items-grid">{DEMO_FILLERS.map(i=><button key={i.id} className={`item-btn filler${tapped===i.id?' tapped':''}`} onClick={()=>handleItem(i,'filler')}>{i.label}<span className="impact">+{i.value}</span></button>)}</div></div>
        <div className="item-group emptiers"><h3><span className="dot"></span> Relief</h3><div className="items-grid">{DEMO_EMPTIERS.map(i=><button key={i.id} className={`item-btn emptier${tapped===i.id?' tapped':''}`} onClick={()=>handleItem(i,'emptier')}>{i.label}<span className="impact">-{i.value}</span></button>)}</div></div>
        <div className="history-section"><h3>History</h3><HistoryChart entries={entries} /><div className="history-log-wrap"><div className="history-log" ref={logRef}>{entries.slice().reverse().map(e=><div className="log-entry" key={e.id}><span className="time">{fmtTime(e.ts)}</span><span className="label">{e.label}</span><span className={`delta ${e.delta>0?'up':'down'}`}>{e.delta>0?'+':''}{e.delta}</span><span className="level-after">{Math.round(e.level)}%</span></div>)}</div></div></div></div></div></div>
      );

    // ═══════════════════════════════════════
    // APP - ROUTER
    // ═══════════════════════════════════════
    function App() {
      const [route, setRoute] = useState('');
      const [user, setUser] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      const [appTab, setAppTab] = useState('bucket');

      const getRoute = () => (window.location.hash.replace('#/','').replace('#','') || 'home');

      useEffect(() => {
        const onHash = () => { setRoute(getRoute()); };
        window.addEventListener('hashchange', onHash);
        setRoute(getRoute());
        // Check auth on load
        api('/auth/me').then(d => {
          setUser(d.user);
          setAuthChecked(true);
          // Auto-redirect to app if logged in and on home/root
          const r = getRoute();
          if (d.user && (r === 'home' || r === '')) {
            window.location.hash = '#/app';
          }
        }).catch(() => setAuthChecked(true));
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const navigate = (r) => { window.location.hash = `#/${r}`; window.scrollTo(0,0); };
      const onAuth = (u) => { setUser(u); navigate(u.onboarded ? 'app' : 'app'); };
      const onLogout = () => { setUser(null); navigate('home'); };
      const onOnboarded = () => { setUser(prev => ({...prev, onboarded: true})); };

      // Handle shared view (no auth needed)
      if (route.startsWith('shared/')) {
        const token = route.replace('shared/', '');
        return <><nav><a className="logo" onClick={()=>navigate('home')}>headroom</a><ul className="nav-links"><li><a onClick={()=>navigate('home')}>Home</a></li></ul></nav><SharedView token={token} /><footer><p>&copy; 2026 Headroom</p></footer></>;
      }

      if (!authChecked) return <div className="loading">Loading...</div>;

      // Authenticated app routes
      if (user && route.startsWith('app')) {
        if (!user.onboarded) {
          return <><nav><a className="logo">headroom</a><ul className="nav-links"><li><span className="nav-user">{user.displayName || user.email}</span></li></ul></nav><OnboardingPage onComplete={onOnboarded} /></>;
        }
        const tab = route.replace('app/','').replace('app','') || 'bucket';
        return (<>
          <nav><a className="logo" onClick={()=>navigate('app')}>headroom</a>
            <ul className="nav-links">
              <li><a className={tab==='bucket'||tab===''?'active':''} onClick={()=>navigate('app')}>Bucket</a></li>
              <li><a className={tab==='history'?'active':''} onClick={()=>navigate('app/history')}>History</a></li>
              <li><a className={tab==='patterns'?'active':''} onClick={()=>navigate('app/patterns')}>Patterns</a></li>
              <li><a className={tab==='settings'?'active':''} onClick={()=>navigate('app/settings')}>Settings</a></li>
              {user.isAdmin && <li><a className={tab==='admin'?'active':''} onClick={()=>navigate('app/admin')}>Admin</a></li>}
            </ul>
          </nav>
          <div className="app-page">
            {(tab===''||tab==='bucket') && <AppBucket user={user} />}
            {tab==='history' && <AppHistory />}
            {tab==='patterns' && <AppPatterns />}
            {tab==='settings' && <AppSettings user={user} onLogout={onLogout} />}
            {tab==='admin' && user.isAdmin && <AdminPanel />}
          </div>
        </>);
      }

      // Public nav
      const navLink = (r, label) => <a className={route===r?'active':''} onClick={()=>navigate(r)}>{label}</a>;
      return (<>
        <nav>
          <a className="logo" onClick={()=>navigate('home')}>headroom</a>
          <ul className="nav-links">
            <li>{navLink('demo', 'Demo')}</li>
            <li>{navLink('why', 'Why it works')}</li>
            <li>{navLink('contact', 'Contact')}</li>
            {user ? <li><a className="nav-user" onClick={()=>navigate('app')}>{user.displayName || 'My bucket'}</a></li>
                   : <li><a onClick={()=>navigate('login')}>Log in</a></li>}
          </ul>
        </nav>
        {route === 'login' && <LoginPage navigate={navigate} onAuth={onAuth} />}
        {route === 'register' && <RegisterPage navigate={navigate} onAuth={onAuth} />}
        {route === 'demo' && <DemoPage />}
        {(route === 'home' || route === '') && <LandingPage navigate={navigate} />}
        {!['login','register','demo','home',''].includes(route) && <div className="page" style={{paddingTop:'100px',textAlign:'center'}}><h1 style={{fontFamily:'var(--font-display)',color:'var(--text-bright)'}}>Coming soon</h1><p style={{color:'var(--text-muted)',marginTop:'1rem'}}>This page is being built.</p></div>}
        <footer><p>&copy; 2026 Headroom. Built in Nottingham. <a onClick={()=>navigate('contact')}>Contact</a></p></footer>
      </>);
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(r => console.log('SW:', r.scope)).catch(e => console.log('SW fail:', e));
      });
    }
  </script>
</body>
</html>
