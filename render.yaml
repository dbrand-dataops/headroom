services:
  - type: web
    name: headroom
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: headroom-db
          property: connectionString

databases:
  - name: headroom-db
    plan: basic-256mb
    databaseName: headroom
    user: headroom
